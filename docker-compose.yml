version: '3.8'

services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: props_db
    environment:
      POSTGRES_USER: props_user
      POSTGRES_PASSWORD: props_password
      POSTGRES_DB: props_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: props_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning

  pgadmin:
    image: dpage/pgadmin4
    container_name: props_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@props.ai
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    depends_on:
      - db

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
