version: '3.8'

services:
  # 1. PostgreSQL Database with Vector Search (pgvector)
  db:
    image: ankane/pgvector:v0.5.1
    container_name: props_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-props_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-props_password}
      POSTGRES_DB: ${POSTGRES_DB:-props_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-props_user} -d ${POSTGRES_DB:-props_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: props_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. FastAPI AI/ML Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: props_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://props_user:props_password@db:5432/props_db
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: props_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # 5. pgAdmin Management UI
  pgadmin:
    image: dpage/pgadmin4
    container_name: props_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@props.ai}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    depends_on:
      - db

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
